<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=en/index.html">
    <title>Redirecting...</title>
    <script>
        // Check user language and redirect accordingly
        var lang = navigator.language || navigator.userLanguage;
        if (lang.startsWith('es')) {
            window.location.href = "es/index.html";
        } else {
            window.location.href = "en/index.html";
        }
    </script>

    <link rel="icon" type="image/webp" href="assets/images/fja-professional-cleaning-logo.webp">
</head>
<body>
    <p>Redirecting you to the main site... <a href="en/index.html">Click here</a> if you are not redirected.</p>
</body>
</html>
